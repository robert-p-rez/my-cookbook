services:
  cookbook:
    build: .
    image: my-cookbook:latest
    pull_policy: build
    container_name: my-cookbook
    restart: unless-stopped
    expose:
      - "8789"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8789/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      upload-api:
        condition: service_healthy
    networks:
      - perezdev_proxy

  upload-api:
    build: ./upload_service
    image: my-cookbook-uploads:latest
    pull_policy: build
    container_name: cookbook-upload-api
    restart: unless-stopped
    environment:
      ALLOWED_ORIGIN: "https://gabbys-cookbook.perezdev.com"
      UPLOAD_ROOT: /data/uploads
    expose:
      - "8790"
    volumes:
      - cookbook-uploads:/data/uploads
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - perezdev_proxy

networks:
  perezdev_proxy:
    external: true

volumes:
  cookbook-uploads:
