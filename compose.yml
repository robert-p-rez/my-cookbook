services:
  cookbook:
    build: .
    image: my-cookbook:latest
    pull_policy: build
    container_name: my-cookbook
    restart: unless-stopped
    expose:
      - "8789"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8789/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cookbook-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    container_name: cookbook-cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - "${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}"
    depends_on:
      cookbook:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - cookbook-network

networks:
  cookbook-network:
    ipam:
      config:
        - subnet: 172.31.251.0/24
